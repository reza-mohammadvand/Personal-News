name: بروزرسانی و انتشار اخبار

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: دریافت خبرهای تازه
        run: |
          curl --retry 2 --fail --silent --show-error \
            https://reza-mohammadvand.github.io/Personal-News/data/news.json \
            --output /tmp/previous-news.json || true
          set +e
          python scripts/fetch_news.py > data/fetch-diagnostic.txt 2>&1
          result=$?
          cat data/fetch-diagnostic.txt
          if [ $result -ne 0 ]; then
            echo "First collection attempt failed; retrying once..." | tee -a data/fetch-diagnostic.txt
            python scripts/fetch_news.py >> data/fetch-diagnostic.txt 2>&1
            result=$?
          fi
          if [ $result -ne 0 ] && [ -s /tmp/previous-news.json ]; then
            cp /tmp/previous-news.json data/news.json
          fi
          exit 0
        timeout-minutes: 10
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: انتشار در GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
